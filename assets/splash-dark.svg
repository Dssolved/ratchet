<?xml version="1.0" encoding="UTF-8"?>
<!--
  Экран запуска. Фон — цвет приложения, знак по центру акцентом: наоборот
  относительно иконки, потому что запуск ведёт внутрь тёмного интерфейса.
  Квадрат 2732×2732 обрезается под экран любой формы, поэтому знак мелкий и по центру.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="2732" height="2732" viewBox="0 0 108 108">
  <rect width="108" height="108" fill="#0a0a0a" />
  <g transform="translate(54 54) scale(0.34) translate(-54 -54)">
    <path fill="#c4f531" d="M18 84 L58 44 L58 84 Z" />
    <path fill="#c4f531" d="M66 28 L90 28 L90 78 L66 54 Z" />
  </g>
</svg>
