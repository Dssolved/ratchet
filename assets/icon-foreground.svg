<?xml version="1.0" encoding="UTF-8"?>
<!--
  Передний слой адаптивной иконки: зуб храповика и упирающаяся в него собачка.
  Именно собачка делает механизм необратимым — то же, что делает приложение приложением.

  ВАЖНО про размер знака. Генератор ужимает этот слой на 16.7%, чтобы содержимое легло
  в безопасную зону адаптивной иконки. Поэтому здесь знак нарисован НА ВЕСЬ холст,
  а не внутри безопасной зоны: иначе после ужатия он окажется маленьким пятном в центре.

  Зазор между зубом и собачкой — 8 единиц из 108. Это не произвол: на 48-пиксельной
  иконке зазор в 4 единицы схлопывается в полтора пикселя, фигуры сливаются в пятно,
  и весь смысл знака теряется.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 108 108">
  <!-- зуб: пологий подъём и отвесная стена справа -->
  <path fill="#0a0a0a" d="M14 88 L58 44 L58 88 Z" />
  <!-- собачка: упирается в отвесную стену зуба -->
  <path fill="#0a0a0a" d="M66 22 L94 22 L94 82 L66 54 Z" />
</svg>
